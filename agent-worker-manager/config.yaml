# Agent Worker Manager Configuration

server:
  host: 0.0.0.0
  port: 9090

# Worker templates - defines how to start agent-server on remote machines
templates:
  openhands:
    docker:
      image: "ghcr.io/openhands/agent-server:1.14.0-python"
      port: 8000
      health_check: "/health"
      command: "--port 8000"
    host:
      # Command to start agent-server in host mode (process)
      # Requires openhands-agent-server installed on remote machine
      command: "openhands-agent-server --port {port}"
      port: 8000
      health_check: "/health"

  deerflow:
    docker:
      image: "deerflow-agent:latest"
      port: 2024
      health_check: "/ok"
    host:
      command: "langgraph dev --port {port}"
      port: 2024
      health_check: "/ok"

# Database
db_path: "workers.db"

# SSH defaults
ssh:
  connect_timeout: 10
  known_hosts: null  # null = accept any host key (for internal networks)
